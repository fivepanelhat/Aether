[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
description = "Sovereign Agentic Development System - A culturally grounded, extensible AI development orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LicenseRef-Proprietary-CAT"}
authors = [
    {name = "Aether Project Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
webhook = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "tenacity>=9.1.4",
]
computer = [
    "pyautogui>=0.9.54",
    "Pillow>=10.0",
]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "tenacity>=9.1.4",
    "pyautogui>=0.9.54",
    "Pillow>=10.0",
]

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools.dynamic]
version = {attr = "aether.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*"]

[tool.setuptools.package-data]
aether = [
    "bundled_skills/**/*",
    "bundled_skills/**/SKILL.md",
    "bundled_skills/**/references/*",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pin an explicit rule set. Ruff's *unpinned* default expands with each
# release (0.16 treats UP/BLE/I/PL/SIM/RUF as default), which silently turned
# CI red on ~269 pre-existing style findings that are not bugs. E4/E7/E9/F is
# Ruff's documented default baseline (Pyflakes + essential pycodestyle) and
# catches the real correctness issues (undefined names, unused imports, syntax).
# Stylistic modernisation (pyupgrade, import-sort, pylint opinions) is tracked
# as a separate, reviewed task — deliberately not gated here.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Fixes "import file mismatch" from duplicate test module basenames
# (tests/skills_ci/test_validate_skill.py vs skills/aether-skills-ci/tests/test_validate_skill.py).
# importlib import-mode does not require unique basenames or __init__.py files.
addopts = "--import-mode=importlib"
